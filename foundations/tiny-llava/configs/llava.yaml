# tiny-llava config (CLIP ViT-B/32 + GPT-2)
vision_model: openai/clip-vit-base-patch32
llm_model: gpt2
projection_hidden: 1024
projection_num_layers: 2

# Data (COCO-style captioning)
dataset_name: nlpconnect/vit-gpt2-image-captioning
split: train
batch_size: 8
max_length: 128

# Training
epochs: 3
lr: 0.0001
output_dir: checkpoints/llava
